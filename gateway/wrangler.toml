name = "starling-native-gateway"
main = "src/index.js"
compatibility_date = "2026-11-13"
workers_dev = true

[vars]
GITHUB_REPOSITORY = "Fadiba21/starling-native-builds"
GITHUB_WORKFLOW = "build.yml"
GITHUB_REF = "main"
TOOLS_INPUT = "starling"

[[durable_objects.bindings]]
name = "GATEWAY_STATE"
class_name = "GatewayState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewayState"]
